spring:
  application:
    name: backend
  profiles:
    default: local
  data:
    redis:
      repositories:
        enabled: false
  jpa:
    open-in-view: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    from: ${MAIL_FROM:no-reply@dasifind.local}
  auth:
    email-verification:
      code-ttl: 5m
      resend-cooldown: 60s
      max-attempts: 5
      token-ttl: 30m

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
