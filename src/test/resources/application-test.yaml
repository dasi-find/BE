spring:
  datasource:
    url: jdbc:h2:mem:dasi_find;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  auth:
    token:
      secret: test-secret-key-that-is-longer-than-32-bytes
      refresh-cookie-name: __Host-refresh_token
      secure-cookie: true
      cookie-same-site: LAX
